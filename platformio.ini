; LOLIN S3 Mini Pro (ESP32-S3FH4R2, 4MB flash, 2MB PSRAM)
; The S3 Mini Pro shares its chip and memory layout with the LOLIN S3 Mini,
; so the lolin_s3_mini board definition is used.
[env:lolin_s3_mini_pro]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.partitions = default.csv
