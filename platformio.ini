; Two targets share the source; src/board.h selects per build flag.
;   pio run -t upload                          -> LOLIN S3 Mini Pro (default)
;   pio run -e waveshare_s3_lcd_1_28 -t upload -> Waveshare ESP32-S3-Touch-LCD-1.28
[platformio]
default_envs = lolin_s3_mini_pro

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = -O2
; Refuse to upload to a board whose MAC is not listed for the env (see
; tools/check_mac.py). Fill in your boards' MACs; leave empty to skip.
extra_scripts = pre:tools/check_mac.py

; LOLIN S3 Mini Pro (ESP32-S3FH4R2, 4 MB flash, 2 MB PSRAM). Shares its chip
; and memory layout with the LOLIN S3 Mini, so that board definition is used.
[env:lolin_s3_mini_pro]
board = lolin_s3_mini
custom_expected_macs = 24:ec:4a:2a:f6:44
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
board_build.partitions = default.csv

; Waveshare ESP32-S3-Touch-LCD-1.28 (ESP32-S3R2, 16 MB flash, 2 MB PSRAM,
; USB through a CH343P UART bridge, so Serial is the hardware UART).
[env:waveshare_s3_lcd_1_28]
board = esp32-s3-devkitc-1
custom_expected_macs = 84:fc:e6:51:74:e0
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_LCD_128
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
